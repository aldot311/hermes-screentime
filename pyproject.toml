[project]
name = "hermes-screentime"
version = "0.1.0"
description = "Screen-Time for Hermes Agent: measure a product's seconds on screen with proof, and compare edits shot by shot."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "httpx>=0.27,<1",
    "pillow>=10.4,<14",
    "meta-sam-parser>=0.1,<0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib -q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "PLW1510", "ISC"]
# BLE001 off on purpose: tool handlers catch everything so a failure never raises into the agent loop.
# S101: asserts only in tests. S603/S607: subprocess with argv lists is the point of an ffmpeg wrapper.
ignore = ["S101", "S603", "S607", "UP045", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"dev/*" = ["S", "T20"]
