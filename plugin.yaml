name: screentime
version: "0.1.0"
description: "Measure how long a product is on screen in a video, with look-alikes rejected, contract terms checked against the frames that prove them, and a proof reel. Compare a draft with a reference take, shot by shot."
author: Aldo Tile (Aetrai)
manifest_version: 2
api_version: 1
license: MIT
homepage: https://github.com/aldot311/hermes-screentime
tags: [video, measurement, sponsorship, creators, brands]
requires_hermes: ">=0.23.0"
provides_tools:
  - screentime_measure
  - screentime_compare
  - screentime_runs
provides_hooks: []
config_schema:
  meta_api_key:
    type: secret
    env: META_MODEL_API_KEY
    required: false
    label: "Meta Model API key"
    description: "Optional. With it, Measure uses Meta's SAM 3.1 (every frame, most accurate), Muse Spark and Voice Transcribe. Without it, Measure runs on your own Hermes models. Compare and the demo need no key."
  tracker:
    type: str
    choices: [auto, meta, hermes]
    default: auto
    label: "Tracker"
    description: "auto: SAM 3.1 when a Meta key is set, otherwise your own Hermes vision model (task screentime_track). meta: always SAM 3.1. hermes: always your model."
  frames_per_second:
    type: int
    default: 3
    label: "Frames a second your model looks at"
    description: "Only when your Hermes model tracks (1 to 5). More is finer timing and more calls: a 30 s video at 3 is 90 frames in 23 calls."
  verifier:
    type: str
    choices: [auto, meta, hermes]
    default: auto
    label: "Product check"
    description: "auto: Muse Spark when a Meta key is set, otherwise your own Hermes vision model (task screentime_verify). meta: always Muse Spark. hermes: always your model."
  listen:
    type: bool
    default: true
    label: "Listen for the brand name"
    description: "Check spoken mentions and ad disclosures: Muse Voice Transcribe when a Meta key is set, otherwise Hermes speech-to-text (stt in config.yaml)."
  speech:
    type: str
    choices: [auto, meta, hermes]
    default: auto
    label: "Speech-to-text"
    description: "auto: Muse Voice Transcribe when a Meta key is set, otherwise Hermes speech-to-text. meta or hermes: always that one."
  max_usd_per_video:
    type: float
    default: 0.5
    label: "Spend cap per video (USD)"
    description: "Measure refuses to start a paid call that would pass this cap. About $0.003 per second of video plus about $0.02 per checked object."
  max_usd_per_day:
    type: float
    default: 5.0
    label: "Spend cap per day (USD)"
  max_video_seconds:
    type: int
    default: 120
    label: "Longest video Measure accepts (seconds)"
